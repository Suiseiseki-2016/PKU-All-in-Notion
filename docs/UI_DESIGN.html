<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f5">
  <title>PKU All in Notion · 学生客户端原型</title>
  <style>
    :root {
      --ink: #203531;
      --muted: #71827e;
      --line: #dfe8e2;
      --paper: #fffefa;
      --canvas: #f4f7f3;
      --mint: #dceee5;
      --mint-strong: #b8ddca;
      --green: #2e7761;
      --green-deep: #205647;
      --gold: #d9a75e;
      --gold-pale: #fff4df;
      --blue-pale: #eaf1f7;
      --blue: #4e718a;
      --rose-pale: #f9eaea;
      --rose: #a15252;
      --shadow: 0 18px 50px rgba(42, 72, 62, .08);
      --radius: 20px;
      --radius-sm: 12px;
      --focus: 0 0 0 3px rgba(61, 135, 106, .26);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% -10%, rgba(221, 238, 229, .8), transparent 27rem),
        var(--canvas);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hidden { display: none !important; }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--green-deep);
      background: linear-gradient(145deg, #eef8f0, #cde9d9);
      border: 1px solid #c6dfd0;
      border-radius: 14px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -1px;
    }
    .brand-name {
      display: grid;
      gap: 0;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .brand-name small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      margin-top: 4px;
    }

    .onboarding {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, .82fr) minmax(400px, 1fr);
      overflow: hidden;
    }
    .onboarding-aside {
      position: relative;
      padding: clamp(32px, 6vw, 76px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(160deg, rgba(227, 242, 232, .97), rgba(241, 247, 241, .85)),
        var(--mint);
      border-right: 1px solid rgba(128, 163, 143, .18);
      overflow: hidden;
    }
    .onboarding-aside::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      right: -180px;
      bottom: -120px;
      border: 1px solid rgba(58, 119, 89, .15);
      border-radius: 50%;
      box-shadow: 0 0 0 30px rgba(58, 119, 89, .04), 0 0 0 60px rgba(58, 119, 89, .035);
    }
    .aside-copy {
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    .onboarding h1 {
      max-width: 440px;
      margin: 0 0 20px;
      font-size: clamp(34px, 5vw, 62px);
      letter-spacing: -.06em;
      line-height: 1.08;
    }
    .lead {
      color: #527168;
      max-width: 410px;
      font-size: 17px;
      line-height: 1.8;
    }
    .aside-note {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 350px;
      padding-top: 18px;
      color: #648077;
      font-size: 13px;
      border-top: 1px solid rgba(84, 132, 108, .2);
    }
    .aside-note span:first-child { font-size: 20px; }
    .onboarding-main {
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(255, 254, 250, .72);
    }
    .onboarding-card {
      width: min(100%, 540px);
      padding: clamp(24px, 4vw, 46px);
      background: rgba(255, 254, 250, .92);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .onboarding-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }
    .mini-status {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      background: #edf7ef;
      border: 1px solid #d5e9da;
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .progress-wrap { margin-bottom: 34px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .progress-track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .progress-step {
      height: 5px;
      border-radius: 99px;
      background: #e8eee9;
    }
    .progress-step.done, .progress-step.current { background: var(--green); }
    .card-title {
      margin-bottom: 9px;
      font-size: clamp(25px, 3vw, 33px);
      letter-spacing: -.045em;
      line-height: 1.2;
    }
    .card-subtitle {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 14px;
    }
    .connection-list {
      display: grid;
      gap: 10px;
      margin: 0 0 28px;
    }
    .connection-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 16px;
      color: var(--ink);
      background: #fbfcf9;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }
    .connection-item .item-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .connection-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--green-deep);
      background: var(--mint);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
    }
    .connection-item strong { display: block; font-size: 14px; }
    .connection-item small { display: block; color: var(--muted); font-size: 11px; }
    .item-right { display: flex; align-items: center; gap: 8px; }
    .check { color: var(--green); font-size: 17px; font-weight: 800; }
    .trust-list {
      display: grid;
      gap: 12px;
      margin: 0 0 26px;
      padding: 16px 17px;
      background: #fbfcf9;
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      border-radius: 14px;
    }
    .trust-item { display: flex; gap: 11px; align-items: flex-start; }
    .trust-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      margin-top: 1px;
      color: var(--green-deep);
      background: var(--mint);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }
    .trust-item strong { display: block; font-size: 12px; }
    .trust-item small { color: var(--muted); font-size: 11px; line-height: 1.6; }
    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
    }
    .input-row { display: flex; gap: 10px; }
    .text-input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cad9d0;
      border-radius: 11px;
    }
    .text-input::placeholder { color: #a5b4ad; }
    .form-note {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--rose);
      font-size: 12px;
    }
    .form-note.success { color: var(--green); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 16px;
      color: var(--green-deep);
      background: transparent;
      border: 1px solid #c8d9ce;
      border-radius: 11px;
      font-weight: 750;
      white-space: nowrap;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-1px); background: #f5faf5; }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 7px 16px rgba(46, 119, 97, .18);
    }
    .btn-primary:hover { background: var(--green-deep); }
    .btn-quiet { border-color: transparent; }
    .btn-small { min-height: 35px; padding: 7px 11px; font-size: 12px; }
    .full { width: 100%; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      background: var(--canvas);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 27px 17px 18px;
      background: rgba(255, 254, 250, .86);
      border-right: 1px solid var(--line);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 12px 31px;
    }
    .side-kicker {
      margin: 27px 12px 10px;
      color: #98a79f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
    }
    .nav {
      display: grid;
      gap: 4px;
    }
    .nav button {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 11px;
      min-height: 42px;
      padding: 10px 12px;
      color: #708079;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 650;
    }
    .nav button:hover { color: var(--green-deep); background: #f0f6f0; }
    .nav button.active {
      color: var(--green-deep);
      background: var(--mint);
      font-weight: 800;
    }
    .nav-icon {
      width: 21px;
      color: currentColor;
      font-size: 16px;
      text-align: center;
    }
    .sidebar-spacer { flex: 1; }
    .account-card {
      margin: 20px 7px 0;
      padding: 13px;
      background: #f2f7f2;
      border: 1px solid #e1ebe2;
      border-radius: 13px;
    }
    .account-name {
      display: flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 9px;
      font-size: 12px;
      font-weight: 800;
    }
    .avatar {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      color: var(--green-deep);
      background: var(--mint-strong);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
    }
    .account-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .mobile-topbar { display: none; }
    .main {
      min-width: 0;
      padding: 31px clamp(22px, 4vw, 58px) 52px;
    }
    .main-inner { width: min(100%, 1090px); margin: 0 auto; }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 31px;
    }
    .page-title {
      margin-bottom: 6px;
      font-size: clamp(25px, 3vw, 35px);
      letter-spacing: -.05em;
      line-height: 1.2;
    }
    .page-desc { margin: 0; color: var(--muted); font-size: 14px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .sync-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      color: var(--green);
      background: #edf7ef;
      border: 1px solid #d5e8d9;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: #56ae78;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(86, 174, 120, .12);
    }
    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      margin: 35px 0 13px;
    }
    .section-label h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .section-label p { margin: 0; color: var(--muted); font-size: 12px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }
    .stat-card {
      min-height: 142px;
      padding: 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(42, 72, 62, .025);
    }
    .stat-card.green { background: linear-gradient(140deg, #f3faf3, #fffefa); }
    .stat-card.blue { background: linear-gradient(140deg, #f3f7fb, #fffefa); }
    .stat-card.gold { background: linear-gradient(140deg, #fff9ec, #fffefa); }
    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .stat-symbol {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      color: var(--green);
      background: var(--mint);
      border-radius: 9px;
    }
    .blue .stat-symbol { color: var(--blue); background: var(--blue-pale); }
    .gold .stat-symbol { color: #9a6f30; background: var(--gold-pale); }
    .stat-value {
      display: block;
      margin: 15px 0 1px;
      font-size: 31px;
      letter-spacing: -.055em;
      line-height: 1;
    }
    .stat-value span { margin-left: 3px; color: var(--muted); font-size: 13px; letter-spacing: 0; }
    .stat-foot { color: var(--muted); font-size: 11px; }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    .course-card {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      min-height: 157px;
      padding: 21px;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(42, 72, 62, .025);
    }
    .course-card::after {
      content: "";
      position: absolute;
      width: 112px;
      height: 112px;
      right: -34px;
      bottom: -48px;
      border: 16px solid #eff6ef;
      border-radius: 50%;
    }
    .course-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .03em;
    }
    .course-card h3 { margin: 10px 0 7px; font-size: 17px; letter-spacing: -.03em; }
    .course-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .course-card .btn { align-self: flex-end; position: relative; z-index: 1; }
    .course-icon {
      position: absolute;
      top: 20px;
      right: 21px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: var(--green);
      background: var(--mint);
      border-radius: 11px;
      font-weight: 800;
    }
    .course-content { padding-right: 38px; }
    .activity-list {
      display: grid;
      gap: 2px;
      padding: 7px 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .activity-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 0;
      border-bottom: 1px solid #edf1ed;
    }
    .activity-item:last-child { border-bottom: 0; }
    .activity-bullet {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--green);
      background: #edf7ef;
      border-radius: 9px;
      font-size: 13px;
    }
    .activity-item strong { display: block; font-size: 13px; }
    .activity-item small { color: var(--muted); font-size: 11px; }
    .activity-item time { margin-left: auto; color: #9aa9a2; font-size: 11px; }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 12px;
    }
    .breadcrumb button {
      padding: 0;
      color: var(--green);
      background: transparent;
      border: 0;
      font-weight: 750;
    }
    .detail-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 25px;
      padding: 27px;
      background: linear-gradient(120deg, #eef7ef, #fffefa 68%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .detail-hero h1 { margin: 8px 0 10px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.055em; }
    .detail-hero p { max-width: 600px; margin: 0; color: var(--muted); font-size: 13px; }
    .lecture-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
    }
    .hero-actions { display: flex; gap: 9px; flex-shrink: 0; }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      gap: 15px;
      margin-top: 15px;
    }
    .panel {
      padding: 21px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .panel h2 { margin-bottom: 15px; font-size: 16px; letter-spacing: -.02em; }
    .course-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding: 26px;
      background: linear-gradient(120deg, #eef7ef, #fffefa 70%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .course-hero h1 { margin: 7px 0 8px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.055em; }
    .course-hero p { max-width: 650px; margin: 0; color: var(--muted); font-size: 13px; }
    .course-hero .hero-actions { align-items: flex-start; }
    .course-kicker {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .course-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(270px, .8fr);
      gap: 15px;
      margin-top: 15px;
    }
    .lecture-list {
      display: grid;
      gap: 8px;
    }
    .lecture-item {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 13px 14px;
      color: var(--ink);
      text-align: left;
      background: #fbfcfa;
      border: 1px solid #e3ebe5;
      border-radius: 12px;
    }
    .lecture-item:hover, .lecture-item:focus-visible {
      color: var(--green-deep);
      background: #f2f8f2;
      border-color: var(--mint-strong);
    }
    .lecture-item .lecture-number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      color: var(--green-deep);
      background: var(--mint);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .lecture-item strong { display: block; font-size: 13px; }
    .lecture-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .lecture-item .item-arrow { margin-left: auto; color: var(--green); font-size: 18px; }
    .material-summary {
      display: grid;
      gap: 11px;
      margin: 0;
    }
    .material-summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #edf1ed;
      color: var(--muted);
      font-size: 12px;
    }
    .material-summary-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .material-summary-row strong { color: var(--ink); font-size: 13px; }
    .material-summary-total {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 15px;
    }
    .material-summary-total strong { font-size: 32px; letter-spacing: -.05em; line-height: 1; }
    .material-summary-total span { color: var(--muted); font-size: 12px; }
    .material-source-note {
      margin-top: 15px;
      padding: 10px 12px;
      color: #667970;
      background: #f4f8f4;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.65;
    }
    .materials-panel {
      margin-top: 15px;
      padding: 21px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .materials-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }
    .materials-heading h2 { margin: 0 0 4px; font-size: 16px; }
    .materials-heading p { margin: 0; color: var(--muted); font-size: 11px; }
    .material-controls {
      display: flex;
      gap: 6px;
      padding: 4px;
      background: #f2f6f2;

              ${courseLectures.map(item => `<button type="button" class="lecture-item" data-action="select-lecture" data-lecture="${item.id}"><span class="lecture-number">${item.number}</span><span><strong>${item.title}</strong><small>${item.mapped ? `${item.topic} · ${linkedMaterials[item.id].length} 份关联资料` : "资料映射待确认 · 可先查看课程资料"}</small></span><span class="item-arrow" aria-hidden="true">${icon("arrow")}</span></button>`).join("")}

    function lectureLinked(id) {
      return linkedMaterials[id] || [];
    }

    function materialRow(item, linkedToLecture) {
      const badge = item.status === "已索引" ? "indexed" : item.status === "索引中" ? "indexing" : "pending";
      return `<div class="material-row">
        <div class="material-title"><strong title="${item.title}">${item.title}</strong><small>${linkedToLecture ? "已关联本讲" : "课程级资料"}</small></div>
        <span class="material-type">${item.type}</span>
        <span class="status-badge ${badge}">${item.status}</span>
        <span class="material-source">来源 · ${item.source}</span>
        ${button("在 Notion 查看", "open-material-notion", { small: true, before: `<span aria-hidden="true">${icon("launch")}</span>` })}
      </div>`;
    }

    function materialsListHtml(current) {
      const linked = lectureLinked(current.id);
      const all = linked.concat(courseLevelMaterials);
      if (state.materialView === "lecture") {
        return linked.length
          ? `<div class="material-list" aria-live="polite">${linked.map(item => materialRow(item, true)).join("")}</div>`
          : `<div class="empty-materials"><strong>当前视图下暂无资料</strong>可以切换「全部资料」查看课程级索引内容。</div>`;
      }
      if (state.materialView === "type") {
        const groups = [];
        for (const item of all) {
          const existing = groups.find(group => group.type === item.type);
          if (existing) existing.items.push(item);
          else groups.push({ type: item.type, items: [item] });
        }
        return `<div class="material-list" aria-live="polite">${groups.map(group => `<p class="material-group-label">${group.type} · ${group.items.length} 份</p>${group.items.map(item => materialRow(item, item.status && linked.includes(item))).join("")}`).join("")}</div>`;
      }
      return `<div class="material-list" aria-live="polite">${all.map(item => materialRow(item, linked.includes(item))).join("")}</div>`;
    }

    function lecture() {
      const current = courseLectures.find(item => item.id === state.selectedLecture) || courseLectures[0];
      const linkedCount = lectureLinked(current.id).length;
      return shell(`
        <div class="breadcrumb"><button type="button" data-nav="dashboard">总览</button><span aria-hidden="true">/</span><button type="button" data-nav="courses">我的课程</button><span aria-hidden="true">/</span><span>计算机网络</span><span aria-hidden="true">/</span><span>${current.title}</span></div>
        <section class="detail-hero" aria-labelledby="lecture-title">
          <div><span class="lecture-status"><span class="status-dot" aria-hidden="true"></span>${current.syncLabel}</span><h1 id="lecture-title">${current.title}</h1><p>计算机网络 · 2026 秋季学期<br>本页是讲次索引：标题、日期、同步状态与关联资料。完整内容在 Notion 讲次页中打开。</p></div>
          <div class="hero-actions">${button("在 Notion 打开讲次页", "open-lecture-notion", { primary: true, before: `<span aria-hidden="true">${icon("launch")}</span>` })}</div>
        </section>
        <div class="detail-grid">
          <article class="panel" aria-labelledby="lecture-info-title">

              <div class="material-summary-row"><span>上课日期</span><strong>${current.date}</strong></div>
              <div class="material-summary-row"><span>录制时长</span><strong>${current.duration}</strong></div>
              <div class="material-summary-row"><span>同步状态</span><strong>${current.syncLabel}</strong></div>
              <div class="material-summary-row"><span>关联资料</span><strong>${linkedCount} 份${current.mapped ? "" : " · 映射待确认"}</strong></div>
              <div class="material-summary-row"><span>Notion 页面</span><strong>${current.linkLabel}</strong></div>
            </div>
            <p class="material-source-note">客户端只保存讲次与资料的索引信息，不保存课堂正文、转写或资料内容。</p>
          </article>
          <aside class="panel" aria-labelledby="launch-title">
            <h2 id="launch-title">在 Notion 继续</h2>

              <div class="launch-item"><div><strong>写笔记</strong><small>在讲次页的笔记区记录想法</small></div>${button("在 Notion 写笔记", "open-notes-notion", { small: true, before: `<span aria-hidden="true">${icon("notes")}</span>` })}</div>

          </aside>
        </div>
        <section class="materials-panel" aria-labelledby="related-materials-title">
          <div class="materials-heading"><div><h2 id="related-materials-title">本讲相关资料</h2><p>仅索引信息与来源 · 正文在 Notion 中查看</p></div><div class="material-controls" role="group" aria-label="资料查看方式">
            <button type="button" class="material-view ${state.materialView === "lecture" ? "active" : ""}" data-material-view="lecture" aria-pressed="${state.materialView === "lecture"}">按讲次</button>
            <button type="button" class="material-view ${state.materialView === "type" ? "active" : ""}" data-material-view="type" aria-pressed="${state.materialView === "type"}">按资料类型</button>
            <button type="button" class="material-view ${state.materialView === "all" ? "active" : ""}" data-material-view="all" aria-pressed="${state.materialView === "all"}">全部资料</button>
          </div></div>
          ${current.mapped ? materialsListHtml(current) : `<div class="empty-materials"><strong>本讲资料映射尚未确认</strong>目前无法从课程资料索引建立确定的讲次关联。你可以先查看课程级资料，不会把未确认的内容误当成本讲材料。<div style="margin-top:12px">${button("查看课程资料", "open-course", { small: true })}</div></div>`}
          <p class="materials-hint">提示：同一资料可能存在版本或重复项；此处只展示已索引的来源与状态，不暴露本地路径或资料正文。</p>
        </section>

    function statusLabel(status) {
      return { organized: "已整理", "pending-answer": "待作答", "pending-grade": "待批改", graded: "已批改" }[status];
    }

    function exerciseRow(ex) {
      const statusClass = ex.status;
      const statusText = statusLabel(ex.status);
      let actions = "";
      if (ex.status === "organized" || ex.status === "pending-answer") {
        actions += button("在 Notion 作答", "answer-in-notion", { small: true, before: `<span aria-hidden="true">${icon("launch")}</span>` });
      }
      if (ex.status === "pending-grade") {
        actions += button("批改已提交答案", `grade-exercise:${ex.id}`, { small: true, primary: true, before: `<span aria-hidden="true">${icon("quiz")}</span>` });
      }
      if (ex.status === "graded") {
        actions += button("在 Notion 查看解析", "answer-in-notion", { small: true, before: `<span aria-hidden="true">${icon("launch")}</span>` });
      }
      return `<article class="exercise-row ${statusClass}" role="listitem" aria-label="${ex.title}">
        <div class="exercise-main">
          <div class="exercise-title-wrap">
            <h3>${ex.title}</h3>
            <span class="exercise-status ${statusClass}">${statusText}</span>
          </div>
          <p class="exercise-meta">${ex.course} · ${ex.scope}</p>
        </div>
        <div class="exercise-actions">
          ${actions}
          ${ex.status === "pending-grade" ? `<span class="cost-pill small">预计 1–5 AI 点</span>` : ""}
        </div>
      </article>`;
    }

      return shell(`

            <h2 id="exercise-toolbar-title">整理一套练习到 Notion</h2>
            <p>选择课程、讲次或知识点，生成一套练习页并写入你的 Notion 学习空间。支持选择、判断、填空、简答、论述等全部题型。</p>

        ${principles()}
      `);

    function startGrading(id) {
      state.gradingId = id;
      state.gradingComplete = false;
      render();
      window.setTimeout(() => {
        state.gradingComplete = true;
        const ex = exercises.find(e => e.id === id);
        if (ex) { ex.status = "graded"; ex.score = 88; }
        render();
      }, 1800);
    }

    function gradingView() {
      const ex = exercises.find(e => e.id === state.gradingId) || exercises[0];
      if (!state.gradingComplete) {
        return shell(`
          ${pageHeader("练习中心", "正在批改已提交的 Notion 答案…")}
          <section class="loader-card" aria-busy="true" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <h2>正在批改「${ex.title}」</h2>
            <p>后端正在读取 Notion 中的答案，按需调用 AI 评分并写回解析。请稍候。</p>
            <span class="cost-pill" style="margin-top:18px">预计 1–5 AI 点 · 完成后按实际用量结算</span>
          </section>
        `);
      }
      return shell(`
        ${pageHeader("练习中心", "批改完成，详细解析已写回 Notion。")}

          <div class="summary-icon" aria-hidden="true">${icon("check")}</div>

          <p class="summary-note">详细解析、每题得分与改进建议已写回 Notion。客户端只显示总览分数，不展示题目、答案或解析正文。</p>
          <div class="summary-actions">
            ${button("在 Notion 查看解析", "answer-in-notion", { primary: true, before: `<span aria-hidden="true">${icon("launch")}</span>` })}
            ${button("回到练习目录", "open-quiz", { quiet: true })}
          </div>
          <p class="cost-pill" style="margin-top:18px">已按实际用量结算 · 本次消耗 3 AI 点</p>
        </section>
      `);
    }

    function qa() {
      return shell(`
        ${pageHeader("课堂问答", "提问、回答与后续讨论均在 Notion 中完成；客户端仅作启动入口。", `<span class="sync-pill"><span class="status-dot" aria-hidden="true"></span>Notion 已连接</span>`)}
        <section class="launcher-card" aria-labelledby="qa-launcher-title">
          <div class="launcher-icon" aria-hidden="true">${icon("qa")}</div>
          <p class="eyebrow">Notion 启动器</p>
          <h2 id="qa-launcher-title">问答在 Notion 中完成</h2>
          <p>提问、回答与后续讨论均只在 Notion 问答页中完成。客户端不内置聊天窗口、输入框或回答展示，只负责打开你的 Notion 学习空间。</p>
          <div class="launcher-actions">
            ${button("打开 Notion 问答", "open-notion-qa", { primary: true, before: `<span aria-hidden="true">${icon("launch")}</span>` })}
            ${button("回到总览", "open-dashboard", { quiet: true })}
          </div>
          <p class="launcher-meta">将打开 · Notion 学习空间 → 课堂问答页<br>离线原型中以提示反馈代替真实跳转。</p>
        </section>
      `);
    }

    function statesView() {
      return shell(`
        ${pageHeader("状态参考", "索引、同步与打开动作的参考状态：正在发生、可以恢复，或者暂时没有内容。")}
        <div class="state-grid">
          <article class="state-card loading" role="status" aria-busy="true"><div class="state-icon" aria-hidden="true"><span class="spinner" style="width:22px;height:22px;margin:0;border-width:2px"></span></div><h2>正在同步索引</h2><p>正在整理最新的讲次与资料索引。同步在后台进行，你可以继续浏览课程，不会丢失进度。</p>${button("刷新状态", "sync", { small: true })}</article>
          <article class="state-card error" role="alert"><div class="state-icon" aria-hidden="true">!</div><h2>同步遇到问题</h2><p>暂时没有连接上同步服务。检查网络后重试；已建立的索引与 Notion 页面都不会丢失。</p>${button("重新同步", "sync", { small: true, primary: true })}</article>
          <article class="state-card"><div class="state-icon" aria-hidden="true">○</div><h2>还没有已索引的课程</h2><p>连接课程并完成首次同步后，讲次与资料索引会出现在这里。</p>${button("去同步课程", "sync", { small: true, primary: true })}</article>
          <article class="state-card success"><div class="state-icon" aria-hidden="true">${icon("check")}</div><h2>同步完成</h2><p>索引已是最新：讲次、资料与 Notion 页面的对应关系都已就绪。</p>${button("回到总览", "open-dashboard", { small: true, primary: true })}</article>
          <article class="state-card launch"><div class="state-icon" aria-hidden="true">${icon("launch")}</div><h2>正在打开 Notion</h2><p>打开讲次或资料页通常只需要一两秒；期间可以返回继续浏览索引，不会产生重复记录。</p>${button("继续浏览课程", "open-course", { small: true })}</article>
          <article class="state-card error"><div class="state-icon" aria-hidden="true">↺</div><h2>打开没有成功</h2><p>Notion 页面暂时没有打开。可以直接重试；你的索引与已同步内容都不受影响。</p>${button("重新打开", "retry-launch", { small: true, primary: true })}</article>
        </div>
        <section class="principles" aria-labelledby="principles-title"><h2 id="principles-title">Design principles and acceptance cues</h2><div class="principles-grid"><div class="principle"><strong>元数据优先</strong><p>客户端只呈现讲次、资料与练习的索引，不渲染任何正文内容。</p></div><div class="principle"><strong>统一的练习目录</strong><p>已有练习与新生成练习共用同一目录，没有独立的“生成模式”或“练习模式”。</p></div><div class="principle"><strong>客户端触发批改</strong><p>学生点击“批改已提交答案”后，后端读取 Notion 答案并写回评分与解析；客户端只展示分数总览。</p></div><div class="principle"><strong>分数摘要只在客户端</strong><p>详细题目、答案、批改说明与解析均保留在 Notion，客户端不展示、不持久化任何内容正文。</p></div><div class="principle"><strong>Notion 是内容事实源</strong><p>阅读、笔记、练习与问答都在 Notion 页面中完成与保存。</p></div><div class="principle"><strong>客户端零内容持久化</strong><p>不在浏览器或本地设备保存课堂正文、转写、题目、答案或解析内容。</p></div><div class="principle"><strong>启动安全可恢复</strong><p>打开 Notion 的动作都有明确反馈，失败可安全重试，无副作用。</p></div><div class="principle"><strong>不暴露路径与凭据</strong><p>界面、提示与记录中不出现令牌、密钥或本地文件路径。</p></div><div class="principle"><strong>平静的学术绿色</strong><p>留白、低饱和色彩与清晰层级，让索引浏览保持专注。</p></div></div></section>
      `);
    }

    function principles() {
      return `<section class="principles" aria-labelledby="principles-title"><h2 id="principles-title">Design principles and acceptance cues</h2><div class="principles-grid"><div class="principle"><strong>元数据优先</strong><p>讲次、资料与练习以索引形式呈现；正文、笔记、题目、答案与解析一律在 Notion 中打开。</p></div><div class="principle"><strong>统一的练习目录</strong><p>已有练习与新生成练习共用同一目录，没有独立的“生成模式”或“练习模式”。</p></div><div class="principle"><strong>客户端触发批改</strong><p>学生点击“批改已提交答案”后，后端读取 Notion 答案并写回评分与解析；客户端只展示分数总览。</p></div><div class="principle"><strong>分数摘要只在客户端</strong><p>详细题目、答案、批改说明与解析均保留在 Notion，客户端不展示、不持久化任何内容正文。</p></div><div class="principle"><strong>Notion 是内容事实源</strong><p>客户端只负责索引与启动；内容都在你的 Notion 学习空间中维护。</p></div><div class="principle"><strong>安全可恢复的启动</strong><p>每个打开动作都有可见反馈，失败可重试，且不暴露凭据与本地路径。</p></div></div></section>`;
    }

    function render() {
      if (!state.activated) {
        app.innerHTML = onboarding();
        return;
      }
      if (state.gradingId) {
        app.innerHTML = gradingView();
        return;
      }
      app.innerHTML = state.view === "dashboard" ? dashboard()
        : state.view === "courses" ? courses()
        : state.view === "lecture" ? lecture()
        : state.view === "quiz" ? quiz()
        : state.view === "qa" ? qa()
        : statesView();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function activate() {
      const input = document.getElementById("code");
      if (!input || !input.value.trim()) {
        state.notice = "请输入兑换码后再试一次。";
        render();
        document.getElementById("code")?.focus();
        return;
      }
      state.activated = true;
      state.view = "dashboard";
      state.notice = "";
      render();
      showToast("学习空间已激活，课程索引已就绪。");
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-nav]");
      if (nav) {
        state.view = nav.dataset.nav;
        state.gradingId = null;
        state.gradingComplete = false;
        render();
        return;
      }
      const action = event.target.closest("[data-action]");
      if (!action || action.disabled) return;
      const name = action.dataset.action;
      if (name === "activate") {
        activate();
      } else if (name === "sync") {
        showToast("同步完成，讲次与资料索引已更新。");
      } else if (name === "revoke-notion") {
        state.notionConnected = false;
        render();
        showToast("已断开 Notion 连接，可随时重新连接。");
      } else if (name === "connect-notion") {
        state.notionConnected = true;
        render();
        showToast("已重新连接 Notion 学习空间。");
      } else if (name === "open-dashboard") {
        state.view = "dashboard";
        render();
      } else if (name === "open-course") {
        state.view = "courses";
        render();
      } else if (name === "open-lecture") {
        state.view = "lecture";
        render();
      } else if (name === "select-lecture") {
        state.selectedLecture = action.dataset.lecture || "lecture-1";
        state.materialView = "lecture";
        state.view = "lecture";
        render();
      } else if (name === "open-lecture-notion") {
        showToast("正在打开 Notion 讲次页（离线原型以提示代替跳转）。");
      } else if (name === "open-notes-notion") {
        showToast("正在打开 Notion 笔记区（离线原型以提示代替跳转）。");
      } else if (name === "open-quiz-notion") {
        showToast("正在打开 Notion 练习页（离线原型以提示代替跳转）。");
      } else if (name === "open-notion-quiz") {
        showToast("正在打开 Notion 练习（离线原型以提示代替跳转）。");
      } else if (name === "open-notion-qa") {
        showToast("正在打开 Notion 问答（离线原型以提示代替跳转）。");
      } else if (name === "open-material-notion") {
        showToast("正在打开 Notion 中的资料页（离线原型以提示代替跳转）。");
      } else if (name === "retry-launch") {
        showToast("已重新发起打开 Notion 页面（离线原型以提示代替跳转）。");
      } else if (name === "organize-exercise") {
        showToast("正在整理一套练习到 Notion（离线原型以提示代替真实创建）。");
      } else if (name === "answer-in-notion") {
        showToast("正在打开 Notion 练习页（离线原型以提示代替跳转）。");
      } else if (name === "open-quiz") {
        state.gradingId = null;
        state.gradingComplete = false;
        state.view = "quiz";
        render();
      } else if (name.startsWith("grade-exercise:")) {
        const id = name.split(":")[1];
        startGrading(id);
      }
    });

    document.addEventListener("click", (event) => {
      const view = event.target.closest("[data-material-view]");
      if (view) {
        state.materialView = view.dataset.materialView;
        render();
      }
    });
    document.addEventListener("submit", (event) => {
      event.preventDefault();
      if (event.target.id === "activation-form") activate();
    });
    render();
  </script>
</body>
</html>
